name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required for code-scanning SARIF upload

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required for the coverage PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Report coverage on PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      - name: Build
        run: npm run build

  sbom:
    name: SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: bom.json

      - name: Scan SBOM for vulnerabilities
        id: scan
        uses: anchore/scan-action@v7
        with:
          # Scan the SBOM, not the working tree. A directory scan reaches into
          # node_modules and does binary analysis, which reports CVEs in the Go
          # stdlib compiled into vendored binaries (e.g. the native tsc in
          # @typescript/typescript-linux-x64) -- findings we cannot act on --
          # while seeing only a fraction of the npm graph. The SBOM gives the
          # real dependency tree. It carries no file paths, so the SARIF needs
          # locations injected before upload; see the next step.
          sbom: bom.json
          fail-build: true          # gate the pipeline on findings
          severity-cutoff: high     # fail on high/critical (tunable)
          output-format: sarif

      - name: Give SARIF results an artifact location
        if: always()                # the scan fails the build on findings
        run: node scripts/normalize-sarif-locations.mjs "${{ steps.scan.outputs.sarif }}"

      - name: Upload scan results to code scanning
        if: always()                # upload even when the scan fails the build
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          # Ensure results are associated with the head commit of the PR to prevent merge block issues when main is updated
          ref: ${{ github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
